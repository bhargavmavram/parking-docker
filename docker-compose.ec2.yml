services:
  parking-postgres:
    image: postgres:16-alpine
    container_name: parking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - parking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parking-network

  parking-auth-service:
    build:
      context: ../parking-auth-service
    container_name: parking-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://parking-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
      PARKING_JWT_EXPIRATION_MINUTES: ${PARKING_JWT_EXPIRATION_MINUTES}
    ports:
      - "8082:8082"
    depends_on:
      parking-postgres:
        condition: service_healthy
    networks:
      - parking-network

  parking-api-service:
    build:
      context: ../parking-api-service
    container_name: parking-api-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      - parking-auth-service
    networks:
      - parking-network

  parking-location-service:
    build:
      context: ../parking-location-service
    container_name: parking-location-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://parking-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      parking-postgres:
        condition: service_healthy
      parking-auth-service:
        condition: service_started
    networks:
      - parking-network

  parking-booking-service:
    build:
      context: ../parking-booking-service
    container_name: parking-booking-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://parking-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
    ports:
      - "8084:8084"
    depends_on:
      parking-postgres:
        condition: service_healthy
      parking-auth-service:
        condition: service_started
    networks:
      - parking-network

  parking-payment-service:
    build:
      context: ../parking-payment-service
    container_name: parking-payment-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://parking-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
    ports:
      - "8085:8085"
    depends_on:
      parking-postgres:
        condition: service_healthy
      parking-auth-service:
        condition: service_started
    networks:
      - parking-network

volumes:
  parking-postgres-data:
    name: parking-postgres-data

networks:
  parking-network:
    name: parking-network
