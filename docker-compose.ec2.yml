x-awslogs-defaults: &awslogs-defaults
  driver: awslogs
  options:
    awslogs-region: eu-west-1
    awslogs-create-group: "true"

services:
  parking-auth-service:
    build:
      context: ../parking-auth-service
    container_name: parking-auth-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
      PARKING_JWT_EXPIRATION_MINUTES: ${PARKING_JWT_EXPIRATION_MINUTES}
    ports:
      - "8082:8082"
    logging:
      <<: *awslogs-defaults
      options:
        awslogs-region: eu-west-1
        awslogs-create-group: "true"
        awslogs-group: /parking/auth-service
        awslogs-stream: parking-auth-service
    networks:
      - parking-network

  parking-api-service:
    build:
      context: ../parking-api-service
    container_name: parking-api-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      - parking-auth-service
    logging:
      <<: *awslogs-defaults
      options:
        awslogs-region: eu-west-1
        awslogs-create-group: "true"
        awslogs-group: /parking/api-service
        awslogs-stream: parking-api-service
    networks:
      - parking-network

  parking-location-service:
    build:
      context: ../parking-location-service
    container_name: parking-location-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      parking-auth-service:
        condition: service_started
    logging:
      <<: *awslogs-defaults
      options:
        awslogs-region: eu-west-1
        awslogs-create-group: "true"
        awslogs-group: /parking/location-service
        awslogs-stream: parking-location-service
    networks:
      - parking-network

  parking-booking-service:
    build:
      context: ../parking-booking-service
    container_name: parking-booking-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
    ports:
      - "8084:8084"
    depends_on:
      parking-auth-service:
        condition: service_started
    logging:
      <<: *awslogs-defaults
      options:
        awslogs-region: eu-west-1
        awslogs-create-group: "true"
        awslogs-group: /parking/booking-service
        awslogs-stream: parking-booking-service
    networks:
      - parking-network

  parking-payment-service:
    build:
      context: ../parking-payment-service
    container_name: parking-payment-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PARKING_JWT_SECRET: ${PARKING_JWT_SECRET}
    ports:
      - "8085:8085"
    depends_on:
      parking-auth-service:
        condition: service_started
    logging:
      <<: *awslogs-defaults
      options:
        awslogs-region: eu-west-1
        awslogs-create-group: "true"
        awslogs-group: /parking/payment-service
        awslogs-stream: parking-payment-service
    networks:
      - parking-network

networks:
  parking-network:
    name: parking-network
